name: Test and Generate Notebooks as Needed
env:
  ACTIONS_STEP_DEBUG: true
  NOTEBOOK_ROOT: docs/src/notebooks/
on:
  pull_request:

jobs:
  generate_notebooks:
    # exclude pull request's spawned by this job; see "create-pull-request" below:
    if: |
      (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'auto-update-notebooks')) ||
      (github.event_name == 'push' && !startsWith(github.ref_name, 'auto-update-notebooks'))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to push the auto-update-notebooks branch
      pull-requests: write   # to create/edit the replacement pull request
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # get entire commit history, needed for changed-files to work

      - name: Get relevent changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            projects:
              - "**/Project.toml"
            notebooks:
              - "${{ env.NOTEBOOK_ROOT }}**"

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: 'min'

      - name: Enable caching
        uses: julia-actions/cache@v3

      - name: Julia package environment - instantiate and build
        uses: julia-actions/julia-buildpkg@v1
        
      - name: Identify, test, and generate notebooks
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate("NotebookManagementTools")
          import NotebookManagementTools
          
          workspace_changed =
              "${{ steps.changed-files.outputs.projects_any_changed }}" == "true"
          changed_notebook_files =
              split("${{ steps.changed-files.outputs.notebooks_all_changed_files }}", " ")

          # Path to directory where notebook subfolders live
          notebook_root = "${{ env.NOTEBOOK_ROOT }}"

          # Construct a list of dirs for notebooks needing regeneration
          notebook_dirs = workspace_changed ? 
              NotebookManagementTools.notebook_dirs(root=notebook_root) :
              NotebookManagementTools.notebook_dirs_containing(
                  changed_notebook_files;
                  root=notebook_root,
              )

          # Test and generate the notebooks:
          markdown_files = NotebookManagementTools.generate(notebook_dirs; tests=true)

          if isnothing(markdown_files)
              @error "Problem testing a notebook or generating its markdown"
              exit(1)
          else 
              @info "Successfully re-generated these markdown files:\n "*
                  "$markdown_files "
          end 

      - name: Compose the pull request body
        shell: bash
        run: |
          cat > "${{ runner.temp }}/pr-body.md" <<'EOF'
          This pull request **REPLACES** \#${{ github.event.pull_request.number }} as it additionally commits new or regenerated notebook markdown files, plot SVG's, etc.

          **Instructions**

          **Accept the invitation to run pending workflows.** If none are apparent, then close and immediately re-open this pull request. When CI finishes running, you can preview the new documentation [here](https://JuliaAI.github.io/MLJTutorial.jl/previews/PR__SPAWNED_PR_NUMBER__).

          If happy with the preview, merge this pull request to trigger deployment of the new docs to gh-pages.

          You can check repository "Actions" to check when deployment is complete. You should see: ✅ **pages build and deployment**

          This pull request will automatically update if additional commits are successfully added to the parent pull request, \#${{ github.event.pull_request.number }}.
          EOF

      # We deliberately do NOT use peter-evans/create-pull-request here. When its
      # `base` input names a branch other than the checked-out ref, that action
      # rebases *only the changes made during the workflow* onto the base, which
      # discards the parent pull request's own commits. We want the spawned pull
      # request to be a drop-in replacement for the parent, so we branch directly
      # from the checked-out HEAD instead. For a `pull_request` event that HEAD is
      # the merge commit (the parent's branch merged into its base), so the branch
      # diffs against the base as "parent's changes + newly generated files".
      - name: Create or update the replacement pull request
        id: spawn_pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.base_ref }}
          BRANCH: auto-update-notebooks
          BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "No regenerated notebook files to commit; nothing to do."
            exit 0
          fi
          git commit -m "update notebook markdown"
          git push --force origin "$BRANCH"

          number=$(gh pr list --head "$BRANCH" --base "$BASE" --state open \
                     --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            echo "operation=updated" >> "$GITHUB_OUTPUT"
          else
            url=$(gh pr create --head "$BRANCH" --base "$BASE" \
                    --title "Commit Notebook Markdown Changes" \
                    --body-file "$BODY_FILE")
            number="${url##*/}"
            echo "operation=created" >> "$GITHUB_OUTPUT"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The body composed above cannot reference the spawned pull request's own
      # number, because that number does not exist until the pull request does.
      - name: Insert preview link into the pull request body
        if: steps.spawn_pr.outputs.number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.spawn_pr.outputs.number }}
          BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: |
          set -euo pipefail
          sed -i "s/__SPAWNED_PR_NUMBER__/${PR_NUMBER}/g" "$BODY_FILE"
          gh pr edit "$PR_NUMBER" --body-file "$BODY_FILE"

      - name: Post comment flagging further action required
        if: steps.spawn_pr.outputs.operation == 'created'
        uses: mshick/add-pr-comment@v3
        with:
          message: |
            **Attention**
            
            A notebook or Project.toml file has changed and new notebook markdown has been generated. **Review** \#${{ steps.spawn_pr.outputs.number }}, which **replaces** the current PR, to commit the changes and update the documentation on gh-pages.
            This PR can be **CLOSED** at any time.

